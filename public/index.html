<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>DMF RECORDS FLY HOOLIE ENT - Roster</title>
 <link rel="stylesheet" href="/styles.css" />
</head>
<body>
 <header class="masthead">
    <p class="eyebrow">Columbus Built, Worldwide Hustle</p>
    <h1>DMF RECORDS FLY HOOLIE ENT</h1>
    <p class="subtitle" id="subtitle">Roster</p>
 </header>

 <section class="stats" aria-label="Roster stats">
    <div class="stat">
      <span class="stat-label">Core Artists</span>
      <span class="stat-value" id="stat-artists">-</span>
    </div>
    <div class="stat">
      <span class="stat-label">Roster Total</span>
      <span class="stat-value" id="stat-total">-</span>
      <span class="stat-note" id="stat-total-note"></span>
    </div>
    <div class="stat">
      <span class="stat-label">Profiles Unlinked</span>
      <span class="stat-value" id="stat-unlinked">-</span>
      <span class="stat-note" id="stat-unlinked-note"></span>
    </div>
 </section>

 <main>
    <h2 class="section-title">The Roster</h2>
    <div class="grid" id="roster-grid"></div>
 </main>

 <footer class="footnote">
    <p>
      Metrics are shown only when attributed to a source with a date. Artists marked
      <strong>Not tracked</strong> have no sourced reading - no estimate is displayed in its place.
    </p>
 </footer>

 <script type="module" src="/app.js"></script>
</body>
</html>
