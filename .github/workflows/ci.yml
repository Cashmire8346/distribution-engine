name: Distribution Engine CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: node --check src/index.js && node --check src/approvals/index.js && node --check src/ern/deliver.js && node --check src/config.js

      - name: Test
        run: npm test -- --test-reporter=spec
